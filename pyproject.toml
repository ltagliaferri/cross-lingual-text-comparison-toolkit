[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-lingual-toolkit"
version = "0.1.0"
description = "Config-driven pipeline for comparing texts across language boundaries via multilingual sentence embeddings"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Lisa Tagliaferri"}]
requires-python = ">=3.9"

# Core: what every script needs. The heavy model stacks are extras, so
# running one frequency analysis does not mean installing torch.
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
# xlt-embed-corpus, xlt-analysis-umap
embeddings = [
    "sentence-transformers>=2.2",
    "umap-learn>=0.5",
]
# xlt-adjective-window, xlt-dependency-parsing, xlt-cross-corpus-dependency
parsing = [
    "spacy>=3.4",
    "stanza>=1.5",
]
# xlt-analysis-topics
topics = [
    "bertopic>=0.15",
    "pandas>=1.3",
    "seaborn>=0.11",
]
all = [
    "cross-lingual-toolkit[embeddings,parsing,topics]",
]
dev = [
    "cross-lingual-toolkit[all]",
    "pytest>=7.0",
]

[project.scripts]
xlt-embed-corpus = "cross_lingual_toolkit.embed_corpus:main"
xlt-term-frequency = "cross_lingual_toolkit.term_frequency:main"
xlt-lexical-richness = "cross_lingual_toolkit.lexical_richness:main"
xlt-adjective-window = "cross_lingual_toolkit.adjective_window:main"
xlt-dependency-parsing = "cross_lingual_toolkit.dependency_parsing:main"
xlt-cross-corpus-frequency = "cross_lingual_toolkit.cross_corpus_frequency:main"
xlt-cross-corpus-dependency = "cross_lingual_toolkit.cross_corpus_dependency:main"
xlt-analysis-umap = "cross_lingual_toolkit.analysis_a_umap:main"
xlt-analysis-topics = "cross_lingual_toolkit.analysis_b_topics:main"

[tool.setuptools.packages.find]
where = ["src"]

# The example stopword lists ship with the package, so a non-editable
# install can still resolve a configured stopwords_file.
[tool.setuptools.package-data]
cross_lingual_toolkit = ["stopwords/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
